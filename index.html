<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шкали інсультного відділення</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f5fa8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
html{color-scheme:light dark}
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#1c2230;--muted:#6b7385;--line:#e3e6ec;
  --accent:#1f5fbf;--accent-soft:#e7effb;--warn:#b56a00;--bad:#c0392b;--bad-soft:#fbe9e7;--ok:#2e7d32;--ok-soft:#e6f4ea;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151b;--card:#1b2029;--ink:#e8ebf1;--muted:#98a0b1;--line:#2b3240;
  --accent:#7fb0ff;--accent-soft:#22314a;--warn:#f0b24e;--bad:#ff8a80;--bad-soft:#3a2224;--ok:#81c784;--ok-soft:#1f3324;}
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px}
input[type=text],input[type=datetime-local],input[type=date],input[type=time],select{flex:1;min-width:0;width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;font:inherit;font-size:14px;font-weight:600;padding:9px 10px;border:0;background:transparent;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--accent);border-color:var(--accent)}
.tab .b{display:inline-block;min-width:20px;margin-left:4px;padding:1px 6px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:12px}
main{padding:12px 12px 4px;max-width:820px;margin:0 auto}
.donate{max-width:820px;margin:0 auto;padding:8px 14px 110px;text-align:center;font-size:13px;color:var(--muted)}
.donate a{display:inline-block;margin-top:6px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--accent);text-decoration:none;font-weight:600;background:var(--card)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.item h3{margin:0 0 2px;font-size:15px}
.item .hint{color:var(--muted);font-size:13px;margin-bottom:6px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;font:inherit;font-size:15px;padding:9px 10px;margin-top:5px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}
.opt .n{flex:0 0 30px;height:26px;border-radius:7px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .n{background:var(--accent);color:#fff}
.item.todo{border-left:4px solid var(--warn)}
.item.off{opacity:.45;pointer-events:none}
.yn{display:flex;gap:8px;margin-top:6px}
.yn button{flex:1;font:inherit;font-weight:700;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.yn button.on.y{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.yn button.on.n{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.yn.pts button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cols{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
@media (hover:hover) and (pointer:fine){.cols{flex-wrap:wrap;overflow-x:visible}}
.col{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;padding:7px 10px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.col.on{background:var(--accent);border-color:var(--accent);color:#fff}
.col i{font-style:normal;margin-left:4px;padding:0 5px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12px}
.col.on i{background:#fff;color:var(--accent)}
.colhead{margin:2px 2px 6px;font-size:13px;color:var(--muted)}
.colhead b{color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.score{font-size:26px;font-weight:800}
.interp{font-size:13px;color:var(--muted)}
.btn{font:inherit;font-weight:600;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
.grow{flex:1}
.sync{font-size:12px;color:var(--muted);margin:5px 2px 0;min-height:15px}
.sync.ro{color:var(--warn);font-weight:600}
.prow{display:block;width:100%;text-align:left;font:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;color:var(--ink);cursor:pointer}
.prow b{font-size:15px}
.prow .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.prow .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.prow .tag.o{background:var(--bg);color:var(--muted)}
.prow.cur{border-color:var(--accent)}
.fill .btn{flex-direction:column;gap:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid .full{grid-column:1/-1}
.chk{display:block;min-width:0;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
.fld label{display:block;font-size:12px;color:var(--muted);margin:0 0 3px 2px}
.note{font-size:13px;color:var(--muted);margin:10px 2px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px}
.verdict{border-radius:12px;padding:12px;margin-bottom:10px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.verdict.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.verdict.warn{border-color:var(--warn);color:var(--warn)}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.verdict small{display:block;font-weight:400;color:var(--muted);margin-top:3px}
.pv-wrap{overflow:hidden;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff;margin-bottom:12px}
.pv-inner{transform-origin:0 0}

/* ---------- printed sheets (A4 @ 96dpi = 794×1123) ---------- */
.sheet{width:794px;min-height:1123px;padding:30px 32px;background:#fff;color:#000;font-family:Tinos,"Times New Roman",Times,"Liberation Serif",serif;font-size:11px;line-height:1.18;position:relative}
.sheet h1{font-size:15px;text-align:center;margin:0 0 6px}
.sheet h2{font-size:13px;text-align:center;margin:10px 0 4px}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{border:1px solid #000;padding:2px 4px;vertical-align:middle}
.sheet th{font-weight:700;text-align:center}
.sheet .pinfo{margin-bottom:8px;font-size:11.5px}
.sheet .pinfo td{padding:4px 6px;vertical-align:top}
.sheet .crit{font-weight:700;text-align:center;width:88px}
.sheet .desc{font-size:10.3px;line-height:1.16}
.sheet .v{width:27px;text-align:center;font-weight:700;font-size:13px;font-family:Arimo,Arial,"Liberation Sans",sans-serif;padding:0}
.sheet .hv{width:27px;font-size:8.5px;padding:2px 0;line-height:1.05;font-family:Arimo,Arial,"Liberation Sans",sans-serif}
.sheet .tot td{font-weight:700}
.sheet .small{font-size:8px;font-weight:400;font-family:Arimo,Arial,"Liberation Sans",sans-serif;line-height:1.05}
.sheet .leg{font-size:10.5px;margin:4px 0}
.sheet .sign{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.sheet .sign span{display:inline-block;border-bottom:1px solid #000;min-width:160px;margin-left:6px;padding:0 4px}
.sheet .box{font-family:Arimo,Arial,"Liberation Sans",sans-serif;font-size:12px}
.sheet .x{font-family:Arimo,Arial,"Liberation Sans",sans-serif;font-weight:700;font-size:13px;text-align:center}
.sheet .gt{text-align:center;font-family:Arimo,Arial,"Liberation Sans",sans-serif}
.sheet .sh{background:#ececec}
.sheet .foot{position:absolute;left:32px;right:32px;bottom:14px;font-size:8.5px;color:#555;text-align:center}
.chk input{margin:0 6px 0 0;vertical-align:-2px}
</style>
</head>
<body>
<header>
  <div class="row">
    <input type="text" id="pt" placeholder="Прізвище І.Б." autocomplete="off">
    <input type="text" id="yr" placeholder="Рік нар." inputmode="numeric" maxlength="4" autocomplete="off" style="flex:0 0 92px">
    <button class="btn" id="reset" title="Новий пацієнт">↺</button>
  </div>
  <div class="row" style="align-items:center;margin-top:6px">
    <label for="adm" style="font-size:13px;color:var(--muted);white-space:nowrap">Дата госп.:</label>
    <input type="date" id="adm" style="flex:0 0 138px;padding:6px 6px;font-size:14px">
    <input type="time" id="admt" title="Час огляду при поступленні (необов’язково)" style="flex:0 0 100px;padding:6px 6px;font-size:14px">
  </div>
  <div class="sync" id="sync"></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<footer class="donate">☕ Застосунок безкоштовний. Якщо він вам допомагає — можна пригостити автора кавою<br><a href="https://www.privat24.ua/send/kr8h4" target="_blank" rel="noopener">Конверт Приват24</a></footer>
<div class="bar"><div class="in" id="bar"></div></div>
<div class="toast" id="toast"></div>
<div id="offscreen" style="position:fixed;left:-20000px;top:0"></div>

<script>
/* =================== довідники =================== */
const range=(a,b,f)=>Array.from({length:b-a+1},(_,i)=>f(a+i));
const H14=['Госп.','6 год','12 год','18 год','24 год',...range(2,10,i=>i+' доба')];
const HG=['Госп.',...range(1,24,i=>i+' год'),...range(2,10,i=>i+' доба')];
const HM=range(1,10,i=>i+' доба');

const SCALES={
  nihss:{name:'NIHSS',full:'National Institutes of Health Stroke Scale – NIHSS',max:42,cols:H14,
    items:[
      {id:'1a',t:'1a. Притомність',o:[[0,'ясна свідомість'],[1,'сонливість'],[2,'ступор'],[3,'коматозний стан']]},
      {id:'1b',t:'1b. Орієнтація',h:'Назвати місяць і вік',o:[[0,'правильно називає місяць і вік із першої спроби'],[1,'одна відповідь правильна, або пацієнту зробили інтубацію, або в пацієнта тяжка дизартрія, або є мовний бар’єр'],[2,'жодна з відповідей не правильна, або в пацієнта афазія, або пацієнт у комі']]},
      {id:'1c',t:'1c. Виконання команд',o:[[0,'виконує обидві правильно'],[1,'виконує одну'],[2,'не виконує жодної команди або перебуває в комі']]},
      {id:'2',t:'2. Погляд',o:[[0,'норма'],[1,'частковий периферійний параліч (нерви III, IV, VI) або відхилення, яке пацієнт може подолати'],[2,'стійке відхилення']]},
      {id:'3',t:'3. Поле зору',o:[[0,'норма'],[1,'квадрантна геміанопсія або згасання'],[2,'повна геміанопсія'],[3,'сліпота']]},
      {id:'4',t:'4. Рух обличчя',o:[[0,'норма'],[1,'легкий центральний парез, розгладження носо-губної складки'],[2,'виразно виявлений центральний парез або параліч'],[3,'двобічний або периферійний парез чи кома']]},
      {id:'5a',t:'5a. Утримання лівої руки',o:[[0,'нормальне втримання руки впродовж 10 секунд'],[1,'рука повільно опускається, але не до самого низу'],[2,'рука швидко опускається до самого низу'],[3,'рука падає'],[4,'пацієнт не рухається або в комі']]},
      {id:'5b',t:'5b. Утримання правої руки',o:[[0,'нормальне втримання руки впродовж 10 секунд'],[1,'рука повільно опускається, але не до самого низу'],[2,'рука швидко опускається до самого низу'],[3,'рука падає'],[4,'пацієнт не рухається або в комі']]},
      {id:'6a',t:'6a. Утримання лівої ноги',o:[[0,'нормальне втримання ноги впродовж 5 секунд'],[1,'нога повільно опускається, але не до самого низу'],[2,'нога швидко опускається до самого низу'],[3,'нога падає'],[4,'пацієнт не рухається або в комі']]},
      {id:'6b',t:'6b. Утримання правої ноги',o:[[0,'нормальне втримання ноги впродовж 5 секунд'],[1,'нога повільно опускається, але не до самого низу'],[2,'нога швидко опускається до самого низу'],[3,'нога падає'],[4,'пацієнт не рухається або в комі']]},
      {id:'7',t:'7. Атаксія',o:[[0,'атаксія відсутня, пацієнт не розуміє, параліч або кома'],[1,'атаксія в одній кінцівці'],[2,'атаксія удвох кінцівках']]},
      {id:'8',t:'8. Чутливість',o:[[0,'норма'],[1,'помірна втрата чутливості'],[2,'повна втрата чутливості або кома']]},
      {id:'9',t:'9. Мова',o:[[0,'норма'],[1,'утруднений добір слів, помірна афазія'],[2,'виразно проявлені утруднення мовлення'],[3,'повна афазія, пацієнт німий або в комі']]},
      {id:'10',t:'10. Дизартрія',o:[[0,'дизартрія відсутня'],[1,'дизартрія, можна добре зрозуміти'],[2,'дизартрія, пацієнта ледь можна зрозуміти, або пацієнт не відповідає чи перебуває в комі']]},
      {id:'11',t:'11. Згасання',o:[[0,'аномалії відсутні'],[1,'згасання однієї сенсорної модальності або інші ознаки синдрому ігнорування'],[2,'згасання принаймні двох сенсорних модальностей або кома']]}
    ],
    interp:s=> s===0?'Неврологічного дефіциту немає': s<=4?'Легкий інсульт': s<=15?'Інсульт середньої тяжкості': s<=20?'Помірно тяжкий інсульт':'Тяжкий інсульт'
  },
  gcs:{name:'ШКГ',full:'Шкала ком Глазго',max:15,cols:HG,
    items:[
      {id:'E',t:'Розплющування очей (E)',o:[[4,'Довільне'],[3,'На звернену мову'],[2,'На больові подразники'],[1,'Відсутнє']]},
      {id:'V',t:'Мовна реакція (V)',o:[[5,'Орієнтованість повна'],[4,'Сплутана'],[3,'Незрозумілі слова'],[2,'Нечленороздільні звуки'],[1,'Відсутня'],['T','Інтубований (VT)']]},
      {id:'M',t:'Рухова реакція (M)',o:[[6,'Виконує команди'],[5,'Цілеспрямована на больовий подразник'],[4,'Нецілеспрямована на больовий подразник'],[3,'Тонічне згинання на больовий подразник'],[2,'Тонічне розгинання на больовий подразник'],[1,'Відсутня']]}
    ],
    interp:(s,st)=>(s>=15?'Ясна свідомість': s>=13?'Оглушення': s>=9?'Сопор': s>=4?'Кома':'Термінальна кома')+(st&&st.V==='T'?' (V не оцінено — інтубований)':'')
  },
  four:{name:'FOUR',full:'Шкала коми Full Outline UnResponsiveness (FOUR)',max:16,cols:['При поступленні'],
    items:[
      {id:'E',t:'1. Реакції очей (E)',o:[[4,'Очі відкриті, стеження та/або миготіння за командою'],[3,'Очі відкриті, але немає стеження'],[2,'Очі закриті, відкриваються на гучний звук, але стеження немає'],[1,'Очі закриті, відкриваються на біль, але стеження немає'],[0,'Очі залишаються закритими у відповідь на біль']]},
      {id:'M',t:'2. Рухові реакції (M)',o:[[4,'Виконує інструкції (знак відмінно, кулак, знак миру)'],[3,'Локалізує біль'],[2,'Згинальна відповідь на біль'],[1,'Розгинальна відповідь на біль'],[0,'Немає відповіді на біль або генералізований міоклонічний епістатус']]},
      {id:'B',t:'3. Стовбурові рефлекси (B)',o:[[4,'Зіничний і корнеальний рефлекси збережені'],[3,'Одна зіниця розширена і не реагує на світло'],[2,'Відсутні зіничний або рогівковий рефлекси'],[1,'Відсутні зіничний і рогівковий рефлекси'],[0,'Відсутні зіничний, рогівковий і кашльовий рефлекси']]},
      {id:'R',t:'4. Дихальний патерн (R)',o:[[4,'Не інтубований, звичайне регулярне дихання'],[3,'Не інтубований, дихання Чейн-Стокса'],[2,'Не інтубований, нерегулярне дихання'],[1,'Чинить опір апарату ШВЛ'],[0,'Повністю синхронний з апаратом ШВЛ або апное']]}
    ],
    interp:s=> s>=16?'Ясна свідомість': s===15?'Помірне оглушення': s>=13?'Глибоке оглушення': s>=9?'Сопор': s>=7?'Кома I': s>=1?'Кома II':'Кома III (смерть кори головного мозку)'
  },
  mrs:{name:'mRS',full:'Модифікована шкала Ренкіна (Modified Rankin Scale — mRS)',max:6,cols:HM,
    items:[

/* --- GUSS --- */
function gSum(p){ return Object.values(guss[p]).reduce((a,v)=>a+v,0); }
function gDone(p){ return Object.keys(guss[p]).length===(p==='p1'?G1.length:G2.length); }
function gussState(){
  const parts=['p1','semi','liq','sol']; let total=0, stop=null, open={p1:true}, done=false;
  for(let i=0;i<parts.length;i++){
    const p=parts[i]; if(!open[p]) break;
    total+=gSum(p);
    if(!gDone(p)) break;
    if(gSum(p)<5){ stop=p; done=true; break; }
    if(i<parts.length-1) open[parts[i+1]]=true; else done=true;
  }
  return {total,stop,open,done,any:parts.some(p=>Object.keys(guss[p]).length)};
}
function gussInt(t){ return GUSS_INT.find(r=>t>=r[0]&&t<=r[1]); }

  const n=Object.keys(tlt).length, all=n===TLT_FLAT.length;
  let cls='',txt='Відповідайте ТАК / НІ на кожен пункт',sub=`Заповнено ${n} з ${TLT_FLAT.length}`;
  if(absY){cls='bad';txt='Є абсолютні протипоказання ('+absY+') — в/в ТЛТ не проводиться';}
  else if(tltTime>0){cls='warn';txt='Поза «стандартним вікном» вТЛТ (>4,5 год)';}
  else if(relY){cls='warn';txt='Є відносні протипоказання ('+relY+') — рішення приймається індивідуально';}
  else if(all){cls='ok';txt='Протипоказань не виявлено';}
  if(all) sub='Усі пункти заповнено';
  const out=!absY&&tltTime>0;
  return {absY,relY,n,all,cls,txt,sub,out};
}

      return `${S.cols[c]} — ${scoreStr(k,c)}${d}${complete(k,c)?'':' ⚠неповн.'}`;
    }).join('; ')+` → ${S.interp(total(k,f[f.length-1]),cell(k,f[f.length-1]))}`);
  });
  const g=gussState();
  if(g.any) L.push(`GUSS: ${g.total}/20`+(g.done?` — ${gussInt(g.total)[2]}`:' (не завершено)'));
  const tsx=timeStats(); if(tsx.d2n!==null) L.push(`Двері–голка: ${hm(tsx.d2n)}`+(tsx.d2ct!==null?`; двері–КТ: ${hm(tsx.d2ct)}`:''));
  const s=tltState();
  if(s.n||s.out) L.push(`ТЛТ: ${s.txt}`+(tltTime!==null&&!s.out?`; госпіталізація ${TLT_TIME[tltTime]}`:''));
  return `Інсультне відділення\n${pt?'Пацієнт: '+ptLabel()+'\n':''}\n`+(L.length?L.join('\n'):'(нічого не заповнено)');
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
let libs=null;
function ensureLibs(){
  if(!libs) libs=Promise.all([
    window.html2canvas?1:loadScript('lib/html2canvas.min.js'),
    window.jspdf?1:loadScript('lib/jspdf.umd.min.js')
  ]).catch(e=>{libs=null;throw e;});
  return libs;
}
let downloads=null;
if(window.claude&&window.claude.use){ window.claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{}); }
function fileName(){
  const pt=$('pt').value.trim().split(/\s+/)[0]||'пацієнт';
  return `Бланки_${pt}_${nowLocal().slice(0,10)}.pdf`.replace(/[\\/:*?"<>|]/g,'_');
}
let busy=false;
async function buildPDF(sel,scale,q){
  await ensureLibs();
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  /* підказка для друку: за замовчуванням двосторонній (переворот по довгому краю) */
  try{ pdf.viewerPreferences({Duplex:'DuplexFlipLongEdge'}); }catch(_){}
  const off=$('offscreen');
  for(let i=0;i<sel.length;i++){
    off.innerHTML=SHEET_FN[sel[i]]();
    try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(_){}
    const canvas=await html2canvas(off.firstElementChild,{scale,backgroundColor:'#ffffff',windowWidth:794});
    if(i) pdf.addPage();
    /* якщо бланк довший за A4 — зменшуємо пропорційно, щоб уся сторінка вмістилася */
    const hmm=canvas.height*210/canvas.width, w=hmm>297? 210*297/hmm : 210, h=hmm>297? 297 : hmm;
    pdf.addImage(canvas.toDataURL('image/jpeg',q),'JPEG',(210-w)/2,0,w,h);
  }
  off.innerHTML='';
  return pdf.output('blob');
}
async function makePDF(){
  if(busy) return;
  const sel=selSheets();
  if(!sel.length){ toast('Оберіть хоча б один бланк'); return; }
  busy=true; const b=$('pdf'); if(b){b.disabled=true;b.textContent='Готую PDF…';}
  try{
    const blob=await buildPDF(sel,2.5,0.92);
    if(!downloads){ downloads=(window.claude&&window.claude.use)? await window.claude.use('downloads'):null; }
    if(downloads){
      try{ await downloads.save({filename:fileName(),data:blob}); toast('PDF готовий'); }
      catch(e){ if(e&&e.code==='declined') toast('Скасовано'); else toast('Не вдалося зберегти PDF ('+(e&&e.code||'помилка')+')'); }
    } else {
      const f=new File([blob],fileName(),{type:'application/pdf'});
      if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){
        try{ await navigator.share({files:[f],title:fileName()}); toast('PDF готовий'); }catch(e){ if(!(e&&e.name==='AbortError')) toast('Не вдалося поділитися PDF'); }
      } else {
        const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=fileName(); document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(u),60000); toast('PDF завантажено');
      }
    }
  }catch(e){ toast('Не вдалося створити PDF. Перевірте інтернет і спробуйте ще раз.'); }
  finally{ busy=false; const b2=$('pdf'); if(b2){b2.disabled=false;b2.textContent='⬇ Завантажити PDF для друку (A4)';} }
}

let dbTried=false;
function localDB(){
  const K='shkaly_pts_v1';
  const load=()=>{ try{ return JSON.parse(localStorage.getItem(K)||'{}'); }catch(_){ return {}; } };
  const store=o=>{ try{ localStorage.setItem(K,JSON.stringify(o)); }catch(e){ const er=new Error('quota'); er.code='quota_exceeded'; throw er; } };
  const snap=(id,v)=>({id,data:()=>v});
  return {
    doc(path){ return {
      async set(v){ const o=load(); o[path]=v; store(o); },
      async delete(){ const o=load(); delete o[path]; store(o); } }; },
    collection(path){ const get=async()=>{ const o=load(), pre=path+'/';
        const ids=new Set(); Object.keys(o).forEach(k=>{ if(k.startsWith(pre)){ const r=k.slice(pre.length); if(!r.includes('/')) ids.add(r); else ids.add(r.split('/')[0]); } });
        return {docs:[...ids].map(id=>snap(id,o[pre+id]||{}))}; };
      const q={get, orderBy(){return q;}, limit(){return q;}}; return q; }
  };
}

  if(e.target.dataset.tm||e.target.id==='adm'||e.target.id==='admt'){ syncWindow(); if(tab==='time'||tab==='tlt') render(true); else renderTabs(); }
  if(e.target.dataset.m){ meta[e.target.dataset.m]=e.target.value; refreshReport(); }
  if(e.target.dataset.ps){ printSel[e.target.dataset.ps]=e.target.checked; refreshReport(); renderBar(); }
});
window.addEventListener('resize',fitPreview);
$('adm').value=meta.adm;
render();
</script>
